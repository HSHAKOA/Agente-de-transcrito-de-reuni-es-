name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    # windows-latest, nao ubuntu: o projeto e desenvolvido/testado pra
    # Windows (WASAPI, CTRL_BREAK_EVENT, COM per-thread, is_pid_running
    # via ctypes) -- rodar em Linux exercitaria so os caminhos genericos,
    # nao o comportamento real do produto.
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest

      - name: Rodar suite de testes
        run: pytest -q
        # Testes que exigem hardware de audio real (tests/test_*_hardware.py)
        # sao pulados automaticamente quando o runner nao tem dispositivo
        # de audio disponivel -- nao precisam de configuracao extra aqui.

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Instalar dependencias
        run: npm ci

      - name: Type-check + build
        run: npm run build

      - name: Lint
        run: npx oxlint
